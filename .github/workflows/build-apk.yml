name: Build Speaking Coach APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download project sources
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 15 SDK and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      # Previous ZIP did not include the Gradle Wrapper JAR/scripts.
      # Install the known-compatible Gradle directly instead.
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeakingCoach-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
