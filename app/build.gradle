plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.speakingcoach'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.speakingcoach'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
